[workspace]
members = ["crates/upnp2", "crates/snoop", "crates/redbook"]
resolver = "2"

[workspace.package]
authors = ["Mike Foster <https://github.com/MusicalNinjaDad>"]
categories = ["Command line utilities", "Network programming"]
edition = "2024"
homepage = "https://github.com/MusicalNinjaDad/splurt"
keywords = ["ssdp", "upnp", "dlna", "docker"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/MusicalNinjaDad/splurt"
rust-version = "1.95.0"
version = "0.1.0"

[workspace.dependencies]
async-ready = "3.0.0"
build_safely = "0.5.4"
chrono = "0.4.44"
clap = { version = "4.6.5", features = ["derive"] }
clap_builder = "4.6.5"
clap_complete = "4.6.8"
clap_mangen = "0.3.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
derive_more = { version = "2.1.1", features = ["display", "from", "from_str", "into"] }
exit_safely = "0.3.1"
futures = "0.3.33"
futures-net = "0.6.0"
futures-timer = "3.0.3"
futures-udp = "0.1.0"
futures-util = { version = "0.3.33", default-features = false, features = ["async-await", "async-await-macro"] }
osinfo = "1.0.0"
ratatui = "0.30.0"
try_v2 = "0.10.1"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

# workspace crates
upnp2 = { path = "crates/upnp2" }

[workspace.lints.clippy]
tests_outside_test_module = "deny"
